name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify for a release
        required: false
        default: ''
        type: string
      publication-only:
        description: Verify published libraries and tooling without building sample applications
        required: false
        default: false
        type: boolean
      invocation:
        description: Distinguishes reusable invocations from direct CI runs
        required: false
        default: reusable
        type: string
  workflow_dispatch:
    inputs:
      publication-only:
        description: Verify only published libraries and tooling (no uploads)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}-${{ inputs.invocation || 'direct' }}
  cancel-in-progress: ${{ !startsWith(inputs.invocation, 'package-publish-') }}

jobs:
  published-consumers:
    name: Published consumer compatibility
    if: ${{ !inputs.publication-only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: ./.github/actions/setup-ci-android
      - uses: ./.github/actions/setup-ci-gradle
        with:
          heap: 4g
      - name: Publish isolated candidate artifacts
        run: |
          ./tooling/gradlew -p tooling publishToMavenLocal \
            -PVERSION_NAME=0.0.0-consumer-check -Dmaven.repo.local="$RUNNER_TEMP/symbols-consumers" \
            --max-workers=1 --no-daemon --stacktrace
          ./gradlew :modules:symbols-core:publishToMavenLocal \
            :modules:material-drawables-outlined:publishToMavenLocal \
            -PVERSION_NAME=0.0.0-consumer-check -Dmaven.repo.local="$RUNNER_TEMP/symbols-consumers" \
            --max-workers=1 --no-daemon --stacktrace
      - name: Test modern and legacy consumers of the same plugin
        run: |
          for profile in android-app android-java android-library kmp jvm; do
            python3 tooling/compatibility/check.py --profile "$profile" --gradle ./gradlew \
              --repository "$RUNNER_TEMP/symbols-consumers" --version 0.0.0-consumer-check
          done
          python3 tooling/compatibility/check.py --profile android-java --gradle ./tooling/gradlew \
            --repository "$RUNNER_TEMP/symbols-consumers" --version 0.0.0-consumer-check \
            --agp-version 8.13.2 --compile-sdk 36 \
            --output build/reports/tooling-compatibility-legacy

  generated-sources-and-fonts:
    name: Generated sources and fonts
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up vector generation dependencies
        uses: ./.github/actions/setup-vector-python

      - name: Run all Python generator and verifier tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Check generated symbol catalog
        run: python tools/generate_material_symbols.py --check

      - name: Check generated API 21 static fonts
        run: python tools/generate_material_static_fonts.py --check

      - name: Generate and verify vector packs
        run: |
          python tools/generate_material_vectors.py
          python tools/generate_material_vectors.py --check

      - name: Verify pinned Material Symbols fonts
        run: python tools/verify_material_fonts.py

  jvm-and-android:
    name: JVM tests and Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up vector generation dependencies
        uses: ./.github/actions/setup-vector-python

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Configure Android SDK
        uses: ./.github/actions/setup-ci-android

      - name: Set up Gradle
        uses: ./.github/actions/setup-ci-gradle

      - name: Validate convention plugins
        run: >-
          ./gradlew
          -p build-logic
          :convention:check
          --max-workers=1
          --no-daemon
          --stacktrace

      - name: Test and validate font generator publications
        run: >-
          ./tooling/gradlew
          -p tooling
          test
          :symbol-gradle-plugin:validatePlugins
          :symbol-generator-core:generatePomFileForMavenPublication
          :symbol-gradle-plugin:generatePomFileForPluginMavenPublication
          :symbol-gradle-plugin:generatePomFileForSymbolFontsPluginMarkerMavenPublication
          --max-workers=1
          --no-daemon
          --stacktrace

      - name: Check signed publication with a disposable key
        run: python3 tools/check_signed_publications.py

      - name: Test JVM and verify release artifacts
        env:
          PUBLICATION_ONLY: ${{ inputs.publication-only }}
        shell: bash
        run: |
          targets=(verifyLibraryJvm)
          if [[ "$PUBLICATION_ONLY" != "true" ]]; then
            targets=(jvmTest assembleRelease lintRelease lintAndroidMain verifyLibraryJvm :benchmarks:animated-font:assembleBenchmark)
          fi
          python3 tools/ci_metrics.py --label "JVM and Android verification" -- \
            ./gradlew "${targets[@]}" --max-workers=1 --no-daemon --stacktrace

      - name: Verify R8 and Android resource shrinking
        if: ${{ !inputs.publication-only }}
        run: >-
          ./gradlew
          :benchmarks:shrinkable-vectors:assembleUnshrunk
          :benchmarks:shrinkable-vectors:assembleShrunk
          --max-workers=1
          --no-daemon
          --stacktrace

      - name: Inspect shrink benchmark APKs
        if: ${{ !inputs.publication-only }}
        run: python3 benchmarks/shrinkable-vectors/verify.py

  web:
    name: ${{ inputs.publication-only && 'JS and Wasm library archives' || 'JS and Wasm production bundles' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up vector generation dependencies
        uses: ./.github/actions/setup-vector-python

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Configure Android SDK
        uses: ./.github/actions/setup-ci-android

      - name: Set up Gradle
        uses: ./.github/actions/setup-ci-gradle

      - name: Compile and verify JS and Wasm libraries
        env:
          PUBLICATION_ONLY: ${{ inputs.publication-only }}
        shell: bash
        run: |
          targets=(verifyWebPublishedArchives)
          if [[ "$PUBLICATION_ONLY" != "true" ]]; then
            targets=(compileKotlinJs compileKotlinWasmJs verifyWebPublishedArchives)
          fi
          python3 tools/ci_metrics.py --label "JS and Wasm library verification" -- \
            ./gradlew "${targets[@]}" \
            -Dorg.gradle.jvmargs="-Xmx8192M -Dfile.encoding=UTF-8" \
            --max-workers=1 --no-daemon --stacktrace

      - name: Link production executables before optimization
        if: ${{ !inputs.publication-only }}
        run: >-
          python3 tools/ci_metrics.py --label "Web production linking" --
          ./gradlew
          :composeApp:compileProductionExecutableKotlinJs
          :composeApp:compileProductionExecutableKotlinWasmJs
          -x :composeApp:wasmJsProductionExecutableCompileSync
          -Dorg.gradle.jvmargs="-Xmx8192M -Dfile.encoding=UTF-8"
          --max-workers=1 --no-daemon --stacktrace

      # Wasm sync finalizes linking and depends on Binaryen. Excluding it above
      # defers optimization until the 8 GB compiler JVM has exited.
      - name: Optimize and bundle web samples with bounded memory
        if: ${{ !inputs.publication-only }}
        env:
          BINARYEN_CORES: '2'
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          python3 tools/ci_metrics.py --label "Web optimization and bundling" --
          ./gradlew
          :composeApp:jsBrowserProductionWebpack
          :composeApp:wasmJsBrowserProductionWebpack
          -Dorg.gradle.jvmargs="-Xmx2048M -Dfile.encoding=UTF-8"
          --max-workers=1 --no-daemon --stacktrace

  apple:
    name: ${{ inputs.publication-only && 'Apple library archives' || 'Apple libraries and sample framework' }}
    runs-on: ${{ inputs.publication-only && 'ubuntu-24.04' || 'macos-26-intel' }}
    timeout-minutes: 90

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up vector generation dependencies
        uses: ./.github/actions/setup-vector-python

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Configure Android SDK
        uses: ./.github/actions/setup-ci-android

      - name: Set up Gradle
        uses: ./.github/actions/setup-ci-gradle

      - name: Verify Apple libraries and optionally link the sample framework
        env:
          PUBLICATION_ONLY: ${{ inputs.publication-only }}
        shell: bash
        run: |
          targets=(verifyApplePublishedArchives)
          if [[ "$PUBLICATION_ONLY" != "true" ]]; then
            targets+=(compileKotlinIosSimulatorArm64 :composeApp:linkDebugFrameworkIosSimulatorArm64)
          fi
          python3 tools/ci_metrics.py --label "Apple verification" -- \
            ./gradlew "${targets[@]}" --max-workers=1 --no-daemon --stacktrace
