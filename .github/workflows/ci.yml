name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      invocation:
        description: Distinguishes reusable invocations from direct CI runs
        required: false
        default: reusable
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.invocation || 'direct' }}
  cancel-in-progress: true

jobs:
  generated-sources-and-fonts:
    name: Generated sources and fonts
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        shell: bash
        run: |
          set -euo pipefail

          python_venv="$RUNNER_TEMP/material-symbols-python"
          python3.13 -m venv "$python_venv"
          echo "$python_venv/bin" >> "$GITHUB_PATH"
          "$python_venv/bin/python" --version

      - name: Install maintainer dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r tools/requirements-font-verification.txt

      - name: Run all Python generator and verifier tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Check generated symbol catalog
        run: python tools/generate_material_symbols.py --check

      - name: Check generated typed font namespaces
        run: python tools/generate_material_font_namespaces.py --check

      - name: Check generated API 21 static fonts
        run: python tools/generate_material_static_fonts.py --check

      - name: Check generated vector packs
        run: python tools/generate_material_vectors.py --check

      - name: Verify pinned Material Symbols fonts
        run: python tools/verify_material_fonts.py

  jvm-and-android:
    name: JVM tests and Android release
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [[ ! -d "$android_sdk" ]]; then
            echo "Android SDK not found at $android_sdk" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Test and validate font generator publications
        run: >-
          ./gradlew
          -p tooling
          test
          :symbol-gradle-plugin:validatePlugins
          :symbol-generator-core:generatePomFileForMavenPublication
          :symbol-gradle-plugin:generatePomFileForPluginMavenPublication
          :symbol-gradle-plugin:generatePomFileForSymbolFontsPluginMarkerMavenPublication
          --no-daemon
          --stacktrace

      - name: Test JVM and verify release artifacts
        run: >-
          ./gradlew
          jvmTest
          assembleRelease
          lintRelease
          verifyPublishedArchives
          --max-workers=1
          --no-daemon
          --stacktrace

      - name: Verify R8 and Android resource shrinking
        run: >-
          ./gradlew
          :benchmarks:shrinkable-vectors:assembleUnshrunk
          :benchmarks:shrinkable-vectors:assembleShrunk
          --max-workers=1
          --no-daemon
          --stacktrace

      - name: Inspect shrink benchmark APKs
        run: python3 benchmarks/shrinkable-vectors/verify.py

  web:
    name: JS and Wasm production bundles
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Compile every library and bundle the web sample
        run: >-
          ./gradlew
          compileKotlinJs
          compileKotlinWasmJs
          :composeApp:jsBrowserProductionWebpack
          :composeApp:wasmJsBrowserProductionWebpack
          --max-workers=1
          --no-daemon
          --stacktrace

  apple:
    name: Apple libraries and sample framework
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile every iOS library and link the sample framework
        run: >-
          ./gradlew
          compileKotlinIosSimulatorArm64
          :composeApp:linkDebugFrameworkIosSimulatorArm64
          --max-workers=1
          --no-daemon
          --stacktrace
