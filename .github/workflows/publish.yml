name: Publish packages
run-name: Release ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

on:
  workflow_call:
    inputs:
      tag:
        description: Existing immutable tag to publish
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release or testing-snapshot tag to publish or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: packages-${{ github.repository }}-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Publication preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      actions: read
      packages: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      libraries_done: ${{ steps.release.outputs.libraries_done }}
      tooling_done: ${{ steps.release.outputs.tooling_done }}
      portal_done: ${{ steps.release.outputs.portal_done }}
      complete: ${{ steps.release.outputs.complete }}
      snapshot: ${{ steps.release.outputs.snapshot }}
      github_components: ${{ steps.release.outputs.github_components }}
    steps:
      - name: Check out release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out publisher tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: publisher
          persist-credentials: false
      - name: Validate tag, main ancestry, and existing publications
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publisher/tools/release.py --tag "$RELEASE_TAG"

  central-credentials:
    name: Check normal-release credentials
    needs: preflight
    if: needs.preflight.outputs.snapshot != 'true' && needs.preflight.outputs.complete != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: maven-central
    steps:
      - name: Check publication credentials before releasing any packages
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD GRADLE_PUBLISH_KEY GRADLE_PUBLISH_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "Missing maven-central environment secret: $name" >&2
              exit 1
            fi
          done

  full-verification:
    name: Verify publishable libraries and tooling
    needs: [preflight, central-credentials]
    if: >-
      !cancelled() && needs.preflight.result == 'success' &&
      needs.preflight.outputs.complete != 'true' &&
      (needs.preflight.outputs.snapshot == 'true' || needs.central-credentials.result == 'success')
    uses: ./.github/workflows/ci.yml
    with:
      publication-only: true
      invocation: package-publish-${{ needs.preflight.outputs.tag }}
      ref: ${{ needs.preflight.outputs.commit }}

  libraries:
    name: Publish Central libraries (${{ github.event.release.tag_name || inputs.tag || github.ref_name }})
    needs: [preflight, full-verification]
    if: needs.preflight.outputs.snapshot != 'true' && needs.preflight.outputs.libraries_done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: maven-central
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Set up vector generation dependencies
        uses: ./.github/actions/setup-vector-python
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Configure Android SDK
        uses: ./.github/actions/setup-ci-android

      - name: Set up Gradle
        uses: ./.github/actions/setup-ci-gradle
      - name: Upload and validate libraries on Maven Central
        timeout-minutes: 90
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          PUBLICATION_VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python3 tools/ci_metrics.py --label "Library publication" --
          ./gradlew "-PVERSION_NAME=$PUBLICATION_VERSION"
          publishAggregationToCentralPortal
          --max-workers=1 --no-configuration-cache --no-daemon --stacktrace
      - name: Wait for public Maven coordinates
        timeout-minutes: 125
        run: python3 tools/release.py --tag "$RELEASE_TAG" --wait-component libraries

  tooling:
    name: Publish Central tooling and Plugin Portal (${{ github.event.release.tag_name || inputs.tag || github.ref_name }})
    needs: [preflight, full-verification]
    if: >-
      needs.preflight.outputs.snapshot != 'true' &&
      (needs.preflight.outputs.tooling_done != 'true' || needs.preflight.outputs.portal_done != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    environment: maven-central
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Set up Gradle
        uses: ./.github/actions/setup-ci-gradle
        with:
          heap: 4g
      - name: Upload and validate tooling on Maven Central
        timeout-minutes: 45
        if: needs.preflight.outputs.tooling_done != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          PUBLICATION_VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          ./tooling/gradlew -p tooling "-PVERSION_NAME=$PUBLICATION_VERSION"
          publishAggregationToCentralPortal
          --max-workers=1 --no-configuration-cache --no-daemon --stacktrace
      - name: Wait for tooling dependencies on Central
        timeout-minutes: 125
        run: python3 tools/release.py --tag "$RELEASE_TAG" --wait-component tooling
      - name: Publish Gradle plugin
        if: needs.preflight.outputs.portal_done != 'true'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          PUBLICATION_VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          ./tooling/gradlew -p tooling "-PVERSION_NAME=$PUBLICATION_VERSION"
          :symbol-gradle-plugin:publishPlugins
          --max-workers=1 --no-configuration-cache --no-daemon --stacktrace

  github-packages:
    name: Publish GitHub ${{ matrix.component }} (${{ needs.preflight.outputs.tag }}, ${{ needs.preflight.outputs.commit }})
    needs: [preflight, full-verification]
    if: >-
      !cancelled() && needs.preflight.result == 'success' && needs.full-verification.result == 'success' &&
      needs.preflight.outputs.snapshot == 'true' && needs.preflight.outputs.complete != 'true'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.preflight.outputs.github_components) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      PUBLICATION_VERSION: ${{ needs.preflight.outputs.version }}
      COMPONENT: ${{ matrix.component }}
      GH_TOKEN: ${{ github.token }}
      ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ github.token }}
    steps:
      - name: Check out verified artifact sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - name: Check out publisher tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: publisher
          persist-credentials: false
      - name: Set up vector generation dependencies
        if: matrix.component == 'libraries'
        uses: ./publisher/.github/actions/setup-vector-python
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Configure Android SDK
        if: matrix.component == 'libraries'
        uses: ./publisher/.github/actions/setup-ci-android
      - name: Set up Gradle
        uses: ./publisher/.github/actions/setup-ci-gradle
      - name: Reject an unconfirmed partial snapshot before uploading
        shell: bash
        run: |
          set -euo pipefail
          gradle=(./gradlew)
          manifest=build/github-packages-manifest.json
          if [[ "$COMPONENT" == tooling ]]; then
            gradle=(./tooling/gradlew -p tooling)
            manifest=tooling/build/github-packages-manifest.json
          fi
          "${gradle[@]}" "-PVERSION_NAME=$PUBLICATION_VERSION" \
            --init-script "$GITHUB_WORKSPACE/publisher/tools/github-packages.init.gradle.kts" \
            githubPackagePublicationManifest --max-workers=1 --no-configuration-cache --no-daemon --stacktrace
          python3 publisher/tools/release.py --tag "$PUBLICATION_VERSION" \
            --check-unpublished-manifest "$manifest"
      - name: Publish testing snapshots to GitHub Packages
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          gradle=(./gradlew)
          if [[ "$COMPONENT" == tooling ]]; then
            gradle=(./tooling/gradlew -p tooling)
          fi
          "${gradle[@]}" "-PVERSION_NAME=$PUBLICATION_VERSION" \
            --init-script "$GITHUB_WORKSPACE/publisher/tools/github-packages.init.gradle.kts" \
            publishAllPublicationsToGitHubPackagesRepository \
            --max-workers=1 --no-configuration-cache --no-daemon --stacktrace
      - name: Verify authenticated package availability
        timeout-minutes: 15
        run: python3 publisher/tools/release.py --tag "$RELEASE_TAG" --wait-component "$COMPONENT"

  github-release:
    name: Create GitHub release
    needs: [preflight, full-verification, libraries, tooling, github-packages]
    if: >-
      !cancelled() && needs.preflight.result == 'success' &&
      (needs.full-verification.result == 'success' || needs.preflight.outputs.complete == 'true') &&
      ((needs.preflight.outputs.snapshot == 'true' &&
        (needs.github-packages.result == 'success' || needs.preflight.outputs.complete == 'true')) ||
       (needs.preflight.outputs.snapshot != 'true' &&
        (needs.libraries.result == 'success' || needs.preflight.outputs.libraries_done == 'true') &&
        (needs.tooling.result == 'success' || (needs.preflight.outputs.tooling_done == 'true' && needs.preflight.outputs.portal_done == 'true'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create generated release notes or preserve the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(--prerelease=false)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" > /dev/null; then
            gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}"
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" "${release_flags[@]}"
          fi
