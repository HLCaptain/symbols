name: Screenshot baselines

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  roborazzi:
    name: Roborazzi previews
    runs-on: macos-15-intel
    timeout-minutes: 90
    # Public fork PR tokens remain read-only. Publishing also checks repository identity.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up vector generation dependencies
        uses: ./.github/actions/setup-vector-python

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Configure Android SDK
        uses: ./.github/actions/setup-ci-android

      - name: Set up Gradle
        uses: ./.github/actions/setup-ci-gradle

      - name: Record branch baselines
        id: head
        shell: bash
        run: |
          set -euo pipefail
          module_path=samples/image-vector-migration
          rm -rf "$module_path/build/roborazzi/baselines" "$module_path/build/outputs/roborazzi"
          ./gradlew :samples:image-vector-migration:recordRoborazziDebug \
            -Proborazzi.cleanupOldScreenshots=true --max-workers=1 --no-daemon --stacktrace
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            mkdir -p "$RUNNER_TEMP/roborazzi-head"
            if [[ -d "$module_path/build/roborazzi/baselines" ]]; then
              cp -R "$module_path/build/roborazzi/baselines"/. "$RUNNER_TEMP/roborazzi-head/"
            fi
          fi

      - name: Record base branch baselines on the same runner
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          module_path="samples/image-vector-migration"
          baseline_path="$module_path/build/roborazzi/baselines"
          base_snapshots="$RUNNER_TEMP/roborazzi-base"
          base_worktree="$RUNNER_TEMP/symbols-roborazzi-base"

          mkdir -p "$base_snapshots"

          git worktree prune
          git worktree add --detach "$base_worktree" "$BASE_SHA"
          cleanup() {
            git worktree remove --force "$base_worktree" || true
          }
          trap cleanup EXIT

          base_build="$base_worktree/$module_path/build.gradle.kts"
          if ! grep -q 'libs.plugins.roborazzi' "$base_build"; then
            echo "Base branch predates screenshot tests; recording the PR baseline only."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          (
            cd "$base_worktree"
            ./gradlew \
              :samples:image-vector-migration:recordRoborazziDebug \
              -Proborazzi.cleanupOldScreenshots=true \
              --max-workers=1 \
              --no-daemon \
              --stacktrace
          )

          base_baseline_path="$base_worktree/$baseline_path"
          if [[ ! -d "$base_baseline_path" ]]; then
            echo "Base branch produced no Roborazzi baselines" >&2
            exit 1
          fi

          rm -rf "$baseline_path"
          mkdir -p "$baseline_path"
          cp -R "$base_baseline_path"/. "$baseline_path"/
          cp -R "$base_baseline_path"/. "$base_snapshots"/
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Compare pull request against base branch
        id: compare
        if: github.event_name == 'pull_request' && steps.base.outputs.available == 'true'
        continue-on-error: true
        run: >-
          ./gradlew
          :samples:image-vector-migration:compareRoborazziDebug
          --rerun-tasks
          --max-workers=1
          --no-daemon
          --stacktrace

      - name: Build public preview and diff report
        id: report
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          steps.head.outcome == 'success' && steps.base.outcome == 'success'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          BASE_SUPPORTED: ${{ steps.base.outputs.available }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p samples/image-vector-migration/build/outputs/roborazzi
          python3 tools/roborazzi_report.py build \
            --base "$RUNNER_TEMP/roborazzi-base" \
            --head "$RUNNER_TEMP/roborazzi-head" \
            --diffs samples/image-vector-migration/build/outputs/roborazzi \
            --report "$RUNNER_TEMP/roborazzi-report" \
            --outcome "$COMPARE_OUTCOME" --base-supported "$BASE_SUPPORTED"

      - name: Publish report branch and update PR image links
        id: publish
        if: >-
          !cancelled() && steps.report.outcome == 'success' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 tools/roborazzi_report.py publish --report "$RUNNER_TEMP/roborazzi-report"

      - name: Explain read-only fork reports
        if: >-
          !cancelled() && steps.report.outcome == 'success' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork comparisons run read-only; public report publishing requires a trusted same-repository branch." >> "$GITHUB_STEP_SUMMARY"
          echo "See docs/SCREENSHOT_TESTING.md for local reproduction." >> "$GITHUB_STEP_SUMMARY"

      - name: Read current visual approval
        id: review
        if: >-
          !cancelled() && steps.report.outcome == 'success' &&
          steps.report.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          approved="$(gh pr view "$PR_NUMBER" --json labels --jq 'any(.labels[]; .name == "ui-review-approved")')"
          echo "approved=$approved" >> "$GITHUB_OUTPUT"

      - name: Enforce comparison health and human visual review
        if: >-
          !cancelled() && steps.report.outcome == 'success' &&
          (steps.report.outputs.technical_failure == 'true' ||
          (steps.report.outputs.has_changes == 'true' && steps.review.outputs.approved != 'true'))
        env:
          TECHNICAL_FAILURE: ${{ steps.report.outputs.technical_failure }}
        shell: bash
        run: |
          if [[ "$TECHNICAL_FAILURE" == "true" ]]; then
            echo "Roborazzi comparison failed; visual approval cannot override test or infrastructure failures." >&2
          else
            echo "Review the current PR image report, apply ui-review-approved, and rerun this check." >&2
          fi
          exit 1
