name: Set up CI Android SDK
description: Install the Android platform required by the version catalog on a fresh hosted runner.
runs:
  using: composite
  steps:
    - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Install the platform and AGP build tools
      shell: bash
      run: |
        set -euo pipefail
        compile_sdk="$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["android-compileSdk"])')"
        # Android 37's SDK package uses the explicit minor version.
        if [[ "$compile_sdk" == "37" ]]; then compile_sdk=37.0; fi
        # Keep the AGP 8 compatibility fixture and AGP 9 build tools available.
        sdkmanager "platforms;android-$compile_sdk" "platforms;android-36" \
          "build-tools;35.0.0" "build-tools;36.0.0"
